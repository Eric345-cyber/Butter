{{define "login.html"}}<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>
body{font-family:system-ui;background:#0b0f14;color:#e6e8eb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.c{background:#111820;border:1px solid #1f2a36;padding:32px;border-radius:10px;width:300px}
h1{font-size:16px;font-weight:600;margin:0 0 20px;text-align:center;letter-spacing:.5px}
input{width:100%;box-sizing:border-box;background:#0b0f14;border:1px solid #2a3644;color:#e6e8eb;padding:10px;border-radius:6px;font-size:14px}
button{width:100%;margin-top:12px;background:#1d4ed8;color:#fff;border:0;padding:10px;border-radius:6px;font-size:14px;cursor:pointer}
</style></head><body>
<div class="c">
<h1>HOLOCAUST / PANEL</h1>
<form method="post" action="/login">

</div>
</body></html>{{end}}
